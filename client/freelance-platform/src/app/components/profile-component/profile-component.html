@if (user(); as current) {
  <section class="profile-card">
    <div class="profile-heading">
      <div>
        <p class="eyebrow">Account settings</p>
        <h1>Profile</h1>
        <p>Update your account details.</p>
      </div>
      <div class="avatar" aria-hidden="true">{{ current.email.charAt(0).toUpperCase() }}</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="updateProfile()">
      <label class="field">
        <span>Email address</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span>New password</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">Password must contain at least 6 characters.</small>
        }
      </label>

      <label class="field">
        <span>Confirm new password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid) {
          <small class="field-error">Password must contain at least 6 characters.</small>
        }
      </label>

      @if (error()) {
        <p class="message error" role="alert">{{ error() }}</p>
      }

      @if (success()) {
        <p class="message success" role="status">{{ success() }}</p>
      }

      <button type="submit" [disabled]="pending()">
        {{ pending() ? 'Saving…' : 'Save changes' }}
      </button>
    </form>
  </section>
} @else {
  <section class="profile-card empty-state">
    <h1>Profile</h1>
    <p>Sign in to edit your profile.</p>
  </section>
}
