<header class="topbar">
  <a routerLink="/" class="brand">Freelance Platform</a>
  <nav class="nav">
    @if (auth.user(); as user) {
      <span class="user">{{ user.email }}</span>
      <button type="button" class="linkish" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/auth">Login</a>
    }
  </nav>
</header>

<main class="page">
  <router-outlet />
</main>
