@if (!isDashboard()) {
  <header class="topbar">
    <a routerLink="/" class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Биржа услуг</a>
    <nav class="nav">
      @if (authService.user(); as user) {
        <span class="user">{{ user.email }}</span>
        <a routerLink="/profile">Профиль</a>
        <button type="button" class="linkish" (click)="logout()">Выйти</button>
      } @else {
        <a routerLink="/auth">Войти</a>
      }
    </nav>
  </header>
}

<main class="page" [class.dashboard-page]="isDashboard()">
  <router-outlet />
</main>
