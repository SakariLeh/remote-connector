@if (!isDashboard()) {
  <header class="topbar">
    <a routerLink="/" class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Биржа услуг</a>
    <nav class="nav">
      @if (authService.user(); as user) {
        <div class="user-menu">
          <button
            type="button"
            class="user-menu-trigger"
            [attr.aria-expanded]="userMenuOpen()"
            aria-haspopup="true"
            aria-controls="user-menu-panel"
            (click)="toggleUserMenu()"
          >
            <span class="user-avatar" aria-hidden="true">{{ user.email.charAt(0).toUpperCase() }}</span>
            <span class="user-email">{{ user.email }}</span>
            <span class="user-menu-chevron" aria-hidden="true">⌄</span>
          </button>
          @if (userMenuOpen()) {
            <div class="user-menu-panel" id="user-menu-panel">
              <a routerLink="/dashboard" (click)="openCabinet('customer')">Мои заказы</a>
              <a routerLink="/dashboard" (click)="openCabinet('executor')">Мои отклики</a>
              <a routerLink="/profile" (click)="closeUserMenu()">Настройки</a>
              <span class="user-menu-divider" aria-hidden="true"></span>
              <button type="button" (click)="logout()">Выход</button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/auth">Войти</a>
      }
    </nav>
  </header>
}

<main class="page" [class.dashboard-page]="isDashboard()">
  <router-outlet />
</main>
