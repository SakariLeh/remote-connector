[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-connector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "aiosqlite",
  "argon2-cffi",
  "email-validator",
  "pydantic",
  "PyJWT",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend_app*"]
